<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Study Bot</title>
<style>
body { font-family: sans-serif; background: #0f0f0f; color: white; display: flex; flex-direction: column; height: 100vh; margin:0; }
#chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; }
.msg { margin:10px 0; padding:12px 15px; border-radius:15px; max-width:80%; }
.user { background:#2f2f2f; align-self:flex-end; }
.bot { background:#1a1a1a; border:1px solid #333; align-self:flex-start; }
#input-area { display:flex; padding:15px; background:#1a1a1a; }
input { flex:1; padding:12px; border-radius:20px; border:none; background:#2f2f2f; color:white; outline:none; }
button { margin-left:10px; padding:12px 20px; border-radius:20px; border:none; background:white; color:black; cursor:pointer; font-weight:bold;}
</style>
</head>
<body>
<div id="chat"></div>
<div id="input-area">
<input id="q" placeholder="Kahi vichar..." onkeypress="if(event.key==='Enter') send()">
<button onclick="send()">Send</button>
</div>
<script>
async function send(){
 let input = document.getElementById('q');
 let text = input.value;
 if(!text) return;
 addMsg(text, 'user');
 input.value = '';
 try{
  let res = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question: text})});
  let data = await res.json();
  console.log(data);
  addMsg(data.answer || JSON.stringify(data), 'bot');
 } catch(e){
  addMsg("Error: " + e, 'bot');
 }
}
function addMsg(t, cls){
 let div = document.createElement('div');
 div.className = 'msg '+cls;
 div.innerText = t;
 document.getElementById('chat').appendChild(div);
 div.scrollIntoView();
}
</script>
</body>
</html>
